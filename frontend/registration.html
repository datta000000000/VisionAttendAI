<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionAttend AI - Student Registration</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom Style -->
    <link href="/static/styles.css" rel="stylesheet">
</head>
<body>

    <div class="d-flex" id="wrapper">
        <!-- Sidebar Container -->
        <div id="sidebar-wrapper">
            <div id="sidebar-container"></div>
        </div>
        
        <!-- Page Content -->
        <div id="page-content-wrapper">
            <!-- Top Navigation Header -->
            <nav class="navbar navbar-expand-lg navbar-custom border-bottom">
                <div class="container-fluid">
                    <div class="d-flex align-items-center">
                        <button class="burger-menu-btn" id="menu-toggle">
                            <i class="fas fa-bars"></i>
                        </button>
                        <h4 class="m-0 fw-bold text-navy">Student Registration</h4>
                    </div>
                    <div class="ms-auto d-flex align-items-center">
                        <span class="text-secondary me-3" id="top-user-role"><i class="fas fa-user-circle me-1"></i>Administrator</span>
                        <button class="btn btn-outline-danger btn-sm" onclick="logout()"><i class="fas fa-sign-out-alt me-1"></i>Logout</button>
                    </div>
                </div>
            </nav>

            <!-- Main Content Area -->
            <div class="container-fluid px-4 py-4">
                
                <!-- 4-Step Wizard Indicator -->
                <div class="step-wizard">
                    <div class="step-wizard-item active" id="step-1-indicator">
                        <div class="step-wizard-num">1</div>
                        <div class="step-wizard-label">Student Info</div>
                    </div>
                    <div class="step-wizard-item" id="step-2-indicator">
                        <div class="step-wizard-num">2</div>
                        <div class="step-wizard-label">Camera Access</div>
                    </div>
                    <div class="step-wizard-item" id="step-3-indicator">
                        <div class="step-wizard-num">3</div>
                        <div class="step-wizard-label">Face Snapshots</div>
                    </div>
                    <div class="step-wizard-item" id="step-4-indicator">
                        <div class="step-wizard-num">4</div>
                        <div class="step-wizard-label">Finalize</div>
                    </div>
                </div>

                <div class="row g-4">
                    <!-- Form Metadata Column -->
                    <div class="col-lg-5 col-md-12">
                        <div class="card border-0 shadow-sm mb-4">
                            <div class="card-header bg-white py-3 border-0">
                                <h5 class="m-0 fw-bold text-primary"><i class="fas fa-user-edit me-2"></i>Student Details</h5>
                            </div>
                            <div class="card-body">
                                <!-- Error/Success Alerts -->
                                <div id="reg-error" class="alert alert-danger d-none" role="alert"></div>
                                <div id="reg-success" class="alert alert-success d-none" role="alert"></div>

                                <form id="registration-form">
                                    <div class="mb-3">
                                        <label for="student_id" class="form-label small fw-bold text-secondary">Student ID</label>
                                        <input type="text" class="form-control" id="student_id" placeholder="e.g., STU12345" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="name" class="form-label small fw-bold text-secondary">Full Name</label>
                                        <input type="text" class="form-control" id="name" placeholder="Enter student's full name" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="department" class="form-label small fw-bold text-secondary">Department</label>
                                        <select class="form-select" id="department" required>
                                            <option value="" disabled selected>Select Department</option>
                                            <option value="Computer Science">Computer Science</option>
                                            <option value="Electrical Engineering">Electrical Engineering</option>
                                            <option value="Mechanical Engineering">Mechanical Engineering</option>
                                            <option value="Civil Engineering">Civil Engineering</option>
                                            <option value="Artificial Intelligence">Artificial Intelligence</option>
                                        </select>
                                    </div>
                                    <div class="row mb-4">
                                        <div class="col-md-6 mb-3">
                                            <label for="year" class="form-label small fw-bold text-secondary">Academic Year</label>
                                            <select class="form-select" id="year" required>
                                                <option value="" disabled selected>Select Year</option>
                                                <option value="1st Year">1st Year</option>
                                                <option value="2nd Year">2nd Year</option>
                                                <option value="3rd Year">3rd Year</option>
                                                <option value="4th Year">4th Year</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label for="section" class="form-label small fw-bold text-secondary">Section</label>
                                            <input type="text" class="form-control" id="section" placeholder="e.g., A" required>
                                        </div>
                                    </div>
                                    <button type="submit" id="reg-submit-btn" class="btn btn-primary w-100 py-3 fw-semibold">
                                        <i class="fas fa-save me-2"></i>Register Student
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Webcam Capture Column -->
                    <div class="col-lg-7 col-md-12">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center">
                                <h5 class="m-0 fw-bold text-primary"><i class="fas fa-camera me-2"></i>Face Snapshots</h5>
                                <button type="button" class="btn btn-outline-primary btn-sm" id="start-cam-btn">
                                    <i class="fas fa-sync-alt me-1"></i>Reset Camera
                                </button>
                            </div>
                            <div class="card-body">
                                <div id="cam-error" class="alert alert-warning d-none" role="alert"></div>

                                <!-- CCTV monitor console style wrapper -->
                                <div class="monitor-console mb-3">
                                    <div class="cctv-overlay">
                                        <div class="cctv-rec-dot" id="cctv-status-badge">STANDBY</div>
                                        <div class="cctv-grid"></div>
                                        <div class="scan-line"></div>
                                    </div>
                                    <!-- Live Video Feed -->
                                    <div class="video-container">
                                        <video id="webcam" class="video-element" autoplay playsinline></video>
                                    </div>
                                </div>

                                <div class="text-center mb-4">
                                    <button type="button" class="btn btn-secondary px-4 py-2 fw-semibold" id="capture-btn" disabled>
                                        <i class="fas fa-circle-dot me-2 text-danger"></i>Capture Image
                                    </button>
                                </div>

                                <hr>

                                <!-- Captured Previews -->
                                <div class="mt-3">
                                    <h6 class="fw-bold text-secondary mb-3">
                                        Captured Snapshots (<span id="captured-count">0</span> / 5)
                                        <span class="text-muted fw-normal ms-2">(min 3 required)</span>
                                    </h6>
                                    <div class="snapshot-preview-container d-flex flex-wrap gap-2" id="snapshot-previews">
                                        <!-- Snapshot previews loaded here dynamically -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/main.js"></script>
    <script src="/static/registration.js"></script>
</body>
</html>
