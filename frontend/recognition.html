<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionAttend AI - Live Attendance</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom Style -->
    <link href="/static/styles.css" rel="stylesheet">
</head>
<body>

    <div class="d-flex" id="wrapper">
        <!-- Sidebar Container -->
        <div id="sidebar-wrapper">
            <div id="sidebar-container"></div>
        </div>
        
        <!-- Page Content -->
        <div id="page-content-wrapper">
            <!-- Top Navigation Header -->
            <nav class="navbar navbar-expand-lg navbar-custom border-bottom">
                <div class="container-fluid">
                    <div class="d-flex align-items-center">
                        <button class="burger-menu-btn" id="menu-toggle">
                            <i class="fas fa-bars"></i>
                        </button>
                        <h4 class="m-0 fw-bold text-navy">Live Recognition Feed</h4>
                    </div>
                    <div class="ms-auto d-flex align-items-center">
                        <span class="text-secondary me-3" id="top-user-role"><i class="fas fa-user-circle me-1"></i>Administrator</span>
                        <button class="btn btn-outline-danger btn-sm" onclick="logout()"><i class="fas fa-sign-out-alt me-1"></i>Logout</button>
                    </div>
                </div>
            </nav>

            <!-- Main Content Area -->
            <div class="container-fluid px-4 py-4">
                <div class="row g-4">
                    <!-- Recognition Display Column -->
                    <div class="col-lg-8 col-md-12">
                        <div class="card border-0 shadow-sm">
                            <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center">
                                <h5 class="m-0 fw-bold text-primary"><i class="fas fa-video me-2"></i>Webcam Live Feed</h5>
                                <div class="d-flex align-items-center">
                                    <span class="badge bg-secondary me-2 p-2" id="faces-count">0</span>
                                    <span class="text-secondary fw-semibold">Faces Detected</span>
                                </div>
                            </div>
                            <div class="card-body">
                                <div id="recognition-cam-error" class="alert alert-warning d-none" role="alert"></div>

                                <!-- Hidden source video for getUserMedia -->
                                <video id="video-feed" style="display:none;" autoplay playsinline></video>

                                <!-- CCTV monitor console style canvas wrapper -->
                                <div class="monitor-console">
                                    <div class="cctv-overlay">
                                        <div class="cctv-rec-dot" id="rec-cctv-badge">SCAN STANDBY</div>
                                        <div class="cctv-grid"></div>
                                        <div class="scan-line d-none" id="rec-scan-line"></div>
                                    </div>
                                    <div class="video-container">
                                        <canvas id="overlay-canvas" class="video-element"></canvas>
                                    </div>
                                </div>

                                <!-- Controls panel -->
                                <div class="text-center mt-4 d-flex justify-content-center gap-3">
                                    <button type="button" class="btn btn-success px-4 py-2 fw-semibold" id="start-recognition-btn">
                                        <i class="fas fa-play me-2"></i>Start Recognition
                                    </button>
                                    <button type="button" class="btn btn-danger px-4 py-2 fw-semibold" id="stop-recognition-btn" disabled>
                                        <i class="fas fa-stop me-2"></i>Stop Recognition
                                    </button>
                                </div>
                                <div class="text-center mt-3 text-muted">
                                    <span id="recognition-loader" class="d-none small"><span class="spinner-border spinner-border-sm me-2"></span>Backend is processing frames...</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Logs Event Panel Column -->
                    <div class="col-lg-4 col-md-12">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-header bg-white py-3 border-0">
                                <h5 class="m-0 fw-bold text-primary"><i class="fas fa-list-check me-2"></i>Recent Detections</h5>
                            </div>
                            <div class="card-body p-0">
                                <ul class="list-group list-group-flush" id="log-list" style="max-height: 520px; overflow-y: auto;">
                                    <li class="list-group-item text-center text-muted py-5">
                                        <i class="fas fa-hourglass me-2"></i>Logs will populate as faces are recognized. Click "Start Recognition".
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/main.js"></script>
    <script src="/static/recognition.js"></script>
</body>
</html>
